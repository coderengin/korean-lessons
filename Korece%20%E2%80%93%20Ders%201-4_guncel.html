<style>

.wrap{max-width:820px;margin:0 auto}

.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.w{background:#f0f0fa;border-radius:16px;padding:12px}.w b{font-size:28px}.w div{font-size:13px;color:var(--mute)}
.wa{min-height:64px;font-size:34px;padding:12px 16px;border:2px solid var(--line);border-radius:16px;background:#fff;outline:0;cursor:text;-webkit-user-select:none;user-select:none;word-break:break-all}

.pr{font-size:13px;color:var(--mute);margin:6px 2px 14px;min-height:18px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--ac);color:#fff;border-radius:14px;padding:12px 18px;font-weight:600;min-height:44px}
.btn.g{background:#ececf7;color:var(--ink)}

/* keyboard */
#kb{position:fixed;left:0;right:0;bottom:0;background:rgba(235,235,245,.96);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);padding:8px 8px calc(10px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s;z-index:50;border-radius:18px 18px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.12)}

.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.x{background:#ececf7;width:44px;height:44px;border-radius:50%;font-size:20px}
/* Writing Assist – Korece hece bloğu yerleşimleri */
.blk{display:grid;gap:7px;width:230px;margin:12px auto}

/* 2 harf:
   Dikey ünlü: yan yana 2 kutu  → ㄱ + ㅏ
   Yatay ünlü: alt alta 2 kutu   → ㄱ + ㅗ */
.blk.v2{grid-template-columns:1fr 1fr;grid-template-rows:70px;grid-template-areas:"l v"}
.blk.h2{grid-template-columns:1fr;grid-template-rows:70px 70px;grid-template-areas:"l" "v"}

/* 3 harf – normal ünlü:
   Dikey: üstte yan yana 2, altta 1 yatay → ㄱ + ㅏ + ㄴ
   Yatay: üst üste 3 yatay              → ㄱ + ㅗ + ㄴ */
.blk.v3{grid-template-columns:1fr 1fr;grid-template-rows:70px 70px;grid-template-areas:"l v" "t t"}
.blk.h3{grid-template-columns:1fr;grid-template-rows:70px 70px 70px;grid-template-areas:"l" "v" "t"}

/* 3 harf – birleşik ünlü:
   solda 2 küçük kutu alt alta, sağda 1 dikey kutu → ㄱ + ㅘ */
.blk.cv3{grid-template-columns:1fr 1fr;grid-template-rows:52px 52px;grid-template-areas:"l v2" "v v2"}

/* 4 harf – normal ünlü + çift 받침:
   Dikey: üst 2 / alt yan yana 2      → ㄱ + ㅏ + ㄴ + ㅎ
   Yatay: üst 2 yatay / alt yan yana 2 → ㄱ + ㅗ + ㄴ + ㅎ */
.blk.v4{grid-template-columns:1fr 1fr;grid-template-rows:70px 70px;grid-template-areas:"l v" "t u"}
.blk.h4{grid-template-columns:1fr;grid-template-rows:52px 52px 70px;grid-template-areas:"l" "v" "t u"}

/* 4 harf – birleşik ünlü + son ünsüz:
   solda 2 küçük alt alta, sağda 1 dikey, altta 1 yatay */
.blk.cv4{grid-template-columns:1fr 1fr;grid-template-rows:52px 52px 70px;grid-template-areas:"l v2" "v v2" "t t"}

/* 5 harf – birleşik ünlü + çift 받침:
   solda 2 küçük alt alta, sağda 1 dikey, altta yan yana 2 */

<template id="L1"><div class="card"><h2>Kaynak</h2><p class="mute">İçerik TOPIK I (başlangıç) düzeyine ve 국립국어원'nın <b>Gözden Geçirilmiş Romanizasyon</b> kurallarına göre hazırlanmıştır. <b>Romanizasyon</b> resmî Latin yazımıdır; <b>Türkçe okunuş</b> yaklaşık bir tahmindir. <b>ɔ</b> = açık o (ㅓ), <b>o</b> = kapalı o (ㅗ). Dokunduğun kartta harfin açıklamasını ve okunuşunu görürsün.</p></div>
<div class="card"><h2>1. Hangul nedir?</h2>
<p>Hangul, 1443'te Kral Sejong döneminde yapılan (1446'da ilan edilen) sesli bir alfabedir: 14 temel ünsüz, 10 temel ünlü, ayrıca çift ünsüzler ve birleşik ünlüler vardır. Harfler tek tek değil, <b>hece blokları</b> halinde yazılır.</p></div>

<div class="card"><h2>2. Ünsüzler (자음)</h2><label class="sw"><input type="checkbox" class="swAbc"><span></span>ABC sırası (kapalı: 가나다 sırası)</label><div class="grid" id="gC"></div></div>
<div class="card"><h2>3. Ünlüler (모음)</h2><label class="sw"><input type="checkbox" class="swAbc"><span></span>ABC sırası (kapalı: 가나다 sırası)</label><div class="grid" id="gV"></div></div>

<div class="card"><h2>4. Hece bloğu nasıl çalışır?</h2><p>Sıra: <b>başlangıç ünsüzü (초성)</b> + <b>ünlü (중성)</b> + isteğe bağlı <b>son ünsüz (받침)</b>.</p><ul class="mute"><li>ㅏ ㅓ ㅣ gibi dikey ünlüler ünsüzün <b>sağına</b>: 가, 서, 이</li><li>ㅗ ㅜ ㅡ gibi yatay ünlüler ünsüzün <b>altına</b>: 오, 도, 그</li><li>Sessiz başlangıçta yer tutucu <b>ㅇ</b> yazılır: 아, 이, 오</li><li>받침 Ders 2'de.</li></ul><p class="mute">Sağdaki <b>YAZMA YARDIMI</b> sekmesinde hece kur.</p></div>
<div class="card"><h2>5. Kendini tanıt · 자기소개</h2><p class="mute">Adını Hangul ile yaz (Yazma Yardımı'nda hece hece kurabilirsin). Alıştırma kelimeleri de Yazma Yardımı sekmesinde.</p>
<div class="wa" id="nameA" data-wa><span class="t"></span><span class="cr"></span></div><div class="pr"></div><div id="intro" class="intro"></div></div>
<div class="card"><h2>6. En temel kalıplar · 기본 표현</h2><p class="mute">Karta dokununca hece parçalarını görürsün.</p><div class="words" id="gP"></div></div>
<div class="card"><h2>7. Mini sınav</h2><div id="quiz"></div></div></template>
<template id="L2"><div class="card"><h2>1. Üçlü ayrım: ㄱ / ㅋ / ㄲ</h2><p>Türkçede olmayan ayrım. Üç ses de var:</p><ul class="mute"><li><b>ㄱ ㄷ ㅂ ㅈ ㅅ</b> yumuşak, az soluklu</li><li><b>ㅋ ㅌ ㅍ ㅊ</b> soluklu: ağzından güçlü hava çıkar</li><li><b>ㄲ ㄸ ㅃ ㅉ ㅆ</b> gergin: boğaz sıkı, hiç hava çıkmaz</li></ul><p class="mute"><b>Kâğıt testi:</b> ağzının önüne ince bir kâğıt tut. 카'da kâğıt belirgin oynar; 가'da az; 까'da neredeyse hiç.</p><div class="words" id="gX"></div></div>
<div class="card"><h2>2. Gergin ünsüzler</h2><div class="grid" id="gT"></div></div>
<div class="card"><h2>3. Birleşik ünlüler</h2><div class="grid" id="gV"></div><p class="mute">ㅐ ve ㅔ bugün aynı okunur (<b>e</b>). ㅗ+ㅏ=ㅘ, ㅗ+ㅐ=ㅙ, ㅗ+ㅣ=ㅚ, ㅜ+ㅓ=ㅝ, ㅜ+ㅔ=ㅞ, ㅜ+ㅣ=ㅟ, ㅡ+ㅣ=ㅢ. ㅙ ㅚ ㅞ hemen hemen aynı (<b>we</b>). w sesi Türkçe v değildir: dudaklar yuvarlak başlar.</p></div>
<div class="card"><h2>4. Son ünsüz · 받침</h2><p>Hece sonunda tüm ünsüzler <b>7 sesten</b> birine iner: <b>k, n, t, l, m, p, ng</b> (ㄱ ㄴ ㄷ ㄹ ㅁ ㅂ ㅇ).</p><p class="mute"><b>Patlatma!</b> Sondaki k, t, p'de ağız kapanır, ses patlamaz. 밥 "bap" değil, dudaklar kapanır ve biter. Çift 받침'de çoğunlukla biri okunur: 닭 [닥], 값 [갑].</p><div class="words" id="gB"></div></div>
<div class="card"><h2>5. 받침 ile kelimeler</h2><div class="words" id="gW"></div></div>
<div class="card"><h2>6. Mini sınav</h2><div id="quiz"></div></div></template>
<template id="L3"><div class="card"><h2>1. Okunuş kuralları · 발음 규칙</h2><p class="mute">Hangul çoğunlukla yazıldığı gibi okunur, ama bazı hecelerde sesler değişir. Kaynak: 국립국어원 <b>표준 발음법</b> (madde numaraları başlıkta). [Köşeli parantez] gerçek okunuştur. Önce ilk üç kuralı oturt; kalanları ders boyunca tekrar tekrar göreceksin.</p><div class="words" id="gR"></div></div>
<div class="card"><h2>2. En temel kalıplar · 기본 표현</h2><div class="words" id="gP"></div></div>
<div class="card"><h2>3. Cümle kalıpları</h2><p class="mute">Şimdilik <b>kalıp</b> olarak öğren, ayrıntısı sonra: <b>저는 / 이름은</b> = “…-ı (konu)”; ünlüden sonra <b>는</b>, ünsüzden sonra <b>은</b>. <b>이에요 / 예요</b> = “…-im / …dır”; ünsüzle biten isimden sonra 이에요 (학생이에요), ünlüyle bitenden sonra 예요 (의사예요).</p><div class="words" id="gS"></div></div>
<div class="card"><h2>4. Mini sınav</h2><div id="quiz"></div></div></template>
<template id="L4"><div class="card"><h2>1. İki sayı sistemi</h2><p><b>Çin-Kore (일 이 삼…)</b> ve <b>öz Kore (하나 둘 셋…)</b>. Hangisinin nerede kullanıldığını ezberlemek gerekir.</p><p class="mute"><b>Çin-Kore:</b> tarih, para, telefon, dakika, kat, numara. <b>Öz Kore:</b> yaş (살), saat (시), adet (개), kişi (명).</p></div>
<div class="card"><h2>2. Çin-Kore sayılar 0-10</h2><div class="words" id="gA"></div></div>
<div class="card"><h2>3. Büyük sayılar</h2><p class="mute">Kural: 11 = 십일 (10+1), 20 = 이십 (2×10), 25 = 이십오. Büyük basamaklar: 백 100, 천 1.000, 만 10.000. <b>Ses değişimi:</b> 십육 (16) [심뉵] okunur (genizsileşme).</p><div class="words" id="gB"></div></div>
<div class="card"><h2>4. Öz Kore sayılar</h2><p class="mute">Sayaçtan (명, 개, 살) önce 하나→<b>한</b>, 둘→<b>두</b>, 셋→<b>세</b>, 넷→<b>네</b>, 스물→<b>스무</b> olur: 한 명, 두 개, 세 시, 스무 살. Genelde 99'a kadar kullanılır.</p><div class="words" id="gC"></div></div>
<div class="card"><h2>5. Hangi sistem nerede?</h2><div class="words" id="gU"></div></div>
<div class="card"><h2>6. Mini sınav</h2><div id="quiz"></div></div></template>

var CV={"ㅗㅏ":"ㅘ","ㅗㅐ":"ㅙ","ㅗㅣ":"ㅚ","ㅜㅓ":"ㅝ","ㅜㅔ":"ㅞ","ㅜㅣ":"ㅟ","ㅡㅣ":"ㅢ"};
var CT={"ㄱㅅ":"ㄳ","ㄴㅈ":"ㄵ","ㄴㅎ":"ㄶ","ㄹㄱ":"ㄺ","ㄹㅁ":"ㄻ","ㄹㅂ":"ㄼ","ㄹㅅ":"ㄽ","ㄹㅌ":"ㄾ","ㄹㅍ":"ㄿ","ㄹㅎ":"ㅀ","ㅂㅅ":"ㅄ"};

 else{r+=ch;t+=ch;}});

var PG=(function(){

function ds(t){return t.toISOString().slice(0,10);}
function streak(){var t=new Date(),n=0;if(d.days.indexOf(ds(t))<0)t.setDate(t.getDate()-1);while(d.days.indexOf(ds(t))>=0){n++;t.setDate(t.getDate()-1);}return n;}
function touch(){var t=ds(new Date());if(d.days.indexOf(t)<0){d.days.push(t);d.days=d.days.slice(-120);}}
function known(L){return L.letters.filter(function(c){return d.let[c]>=2;}).length;}

function ask(){if(i>=qs.length){PG.quiz(sc);box.innerHTML='<div class="qs">'+sc+'/10</div><p style="text-align:center">'+(sc>=8?"Harika! 잘했어요 🎉":"Tekrar dene, her seferinde pekişir.")+'</p><button class="btn" data-a="go">🔄 Yeniden</button>';return;}
 cur=qs[i];box.innerHTML='<p class="mute">Soru '+(i+1)+'/'+qs.length+'</p><div class="qs">'+cur.show+'</div><p style="text-align:center">'+cur.ask+'</p><div class="qo">'+cur.opts.map(function(o){return '<button data-o="'+o+'">'+o+'</button>';}).join("")+'</div><div id="qf" style="text-align:center"></div>';}
function mount(){box=UI.$("#quiz");box.innerHTML='<p class="mute">10 soru. Yanlış yaptıkların sona tekrar eklenir.</p><button class="btn" data-a="go">Başla</button>';
 box.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  if(b.dataset.a==="go")return start();if(b.dataset.a==="nx"){i++;return ask();}
  if(b.dataset.o===undefined||UI.$("#qf").innerHTML)return;var ok=b.dataset.o===cur.ans;b.classList.add(ok?"ok":"bad");
  if(ok){if(!cur.done)sc++;if(cur.letter)PG.mark("let",cur.letter);UI.$("#qf").innerHTML='<button class="btn" data-a="nx">Devam →</button>';}
  else{cur.done=1;if(ex<4){ex++;qs.push(Object.assign({},cur,{done:1}));}UI.$$(".qo button").forEach(function(x){if(x.dataset.o===cur.ans)x.classList.add("ok");});UI.$("#qf").innerHTML='<button class="btn" data-a="nx">Devam →</button>';}});}
return{mount:mount};})();

/* ===== App: lesson registry + side panel ===== */
var App=(function(){
function list(){var el=UI.$("#lpl");if(!el)return;el.innerHTML=LESSONS.map(function(L){return '<button class="li'+(CUR&&CUR.id===L.id?" on":"")+'" data-l="'+L.id+'"><b>Ders '+L.id+'</b><span>'+L.menu+'</span></button>';}).join("");}
function open(id){var L=LESSONS.filter(function(x){return x.id===id;})[0]||LESSONS[0];CUR=L;UI.$("#ltitle").textContent=L.title;UI.$("#lsub").textContent=L.sub;var m=UI.$("#lesson");m.innerHTML="";m.appendChild(document.getElementById(L.tpl).content.cloneNode(true));L.setup();Lesson.renderEx();PG.setLast(L.id);UI.$("#lp").classList.remove("open");window.scrollTo(0,0);PG.render();}
function icon(){try{var c=document.createElement("canvas");c.width=c.height=180;var x=c.getContext("2d"),g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,"#4f6bff");g.addColorStop(1,"#a05cff");x.fillStyle=g;x.fillRect(0,0,180,180);x.fillStyle="#fff";x.font="bold 110px sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText("한",90,98);UI.$("#ati").href=c.toDataURL("image/png");}catch(e){}}
function init(){icon();var p=UI.$("#lp");
 UI.$("#burger").addEventListener("click",function(){p.classList.toggle("open");});document.addEventListener("pointerdown",function(e){if(p.classList.contains("open")&&!e.target.closest("#lp,#burger"))p.classList.remove("open");});UI.$("#lpx").addEventListener("click",function(){p.classList.remove("open");});
 UI.$("#lpl").addEventListener("click",function(e){var b=e.target.closest(".li");if(b)open(+b.dataset.l);});
 open(PG.last());}
return{init:init,list:list};})();

/* ===== Whiteboard ===== */
var WB=(function(){
var cv,cx,st=[],cur=null,tool="p",col="#4f6bff",size=5,dpr=1,pen=false;
function line(q){cx.save();cx.setTransform(dpr,0,0,dpr,0,0);cx.lineCap=cx.lineJoin="round";cx.globalCompositeOperation=q.e?"destination-out":"source-over";cx.strokeStyle=q.c;var P=q.p;
 if(P.length===1){cx.lineWidth=q.w;cx.beginPath();cx.moveTo(P[0][0],P[0][1]);cx.lineTo(P[0][0]+.1,P[0][1]);cx.stroke();}
 for(var i=1;i<P.length;i++){cx.lineWidth=q.w*P[i][2];cx.beginPath();cx.moveTo(P[i-1][0],P[i-1][1]);cx.lineTo(P[i][0],P[i][1]);cx.stroke();}cx.restore();}
function redraw(){cx.clearRect(0,0,cv.width,cv.height);st.forEach(line);}
function fit(){var r=cv.getBoundingClientRect();dpr=window.devicePixelRatio||1;cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);redraw();}
function pt(e){var r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top,e.pointerType==="pen"&&e.pressure>0?.35+e.pressure*1.3:1];}
function save(){var c=document.createElement("canvas");c.width=cv.width;c.height=cv.height;var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(cv,0,0);
 c.toBlob(function(b){try{if(window.claude&&claude.use)claude.use("downloads").then(function(d){if(d)d.save({filename:"beyaz-tahta.png",data:b}).catch(function(){});});}catch(e){}});}
function init(){
cv=UI.$("#wb");cx=cv.getContext("2d");fit();window.addEventListener("resize",fit);UI.$("#tab").addEventListener("click",function(){setTimeout(fit,320);});
cv.addEventListener("pointerdown",function(e){if(e.pointerType==="pen")pen=true;else if(e.pointerType==="touch"&&pen)return; /* avuç içi reddi */
 e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}cur={p:[pt(e)],c:col,w:tool==="e"?24:size,e:tool==="e",id:e.pointerId};st.push(cur);redraw();});
cv.addEventListener("pointermove",function(e){if(!cur||e.pointerId!==cur.id)return;(e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(function(x){cur.p.push(pt(x));});redraw();});
function up(){cur=null;}cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
UI.$("#wbT").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var d=b.dataset;
 function on(sel){UI.$$("#wbT "+sel).forEach(function(x){x.classList.toggle("on",x===b);});}
 if(d.t){tool=d.t;on("[data-t]");}
 else if(d.col){col=d.col;tool="p";on("[data-col]");UI.$$("#wbT [data-t]").forEach(function(x){x.classList.toggle("on",x.dataset.t==="p");});}
 else if(d.w){size=+d.w;on("[data-w]");}
 else if(d.act==="undo"){st.pop();redraw();}
 else if(d.act==="clear"){st=[];redraw();}
 else if(d.act==="save")save();});
UI.$("#ghT").addEventListener("change",function(e){UI.$("#stage").classList.toggle("gh",e.target.checked);});
UI.$("#grT").addEventListener("change",function(e){UI.$("#stage").classList.toggle("g",e.target.checked);});}
return{init:init};})();

document.addEventListener("DOMContentLoaded",function(){Lesson.init();KB.init();WA.init();WB.init();Pop.init();App.init();PG.render();});
</script></body></html>
