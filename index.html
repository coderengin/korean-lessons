<script>
(function(){
"use strict";
var N={
5:[["Dersin girişi · 120 dk","Bugün iki saatte okumadan başlayıp cümle kurmaya gideceğiz. Sıra bilerek böyle: okumayı bilmeyen cümle kuramaz. Önce hece çözeceğiz, sonra cümlelerin yapıştırıcısı olan ekleri öğreneceğiz, sonra kelime ve sayıları cümle içinde kullanacağız, en sonda hep birlikte cümle kuracağız.|Hata yapmak serbest. Hatırlamaya çalışmak öğrenmenin kendisidir; yanlış yapınca beyin doğruyu daha iyi yakalar."],
["Hecenin 3 adımı","Korece hece bir kare gibidir. Karenin içine sırayla üç şey girer: başlangıç ünsüzü, ünlü, istersek altta son ünsüz. 가 = ㄱ + ㅏ, yani g + a = ga. Altına ㄴ gelirse 간, gan.|Ünlü nerede durur? ㅏ ㅓ ㅣ gibi dikey olanlar ünsüzün sağında, ㅗ ㅜ ㅡ gibi yatay olanlar altında. ㅇ başta sessizdir: 아 sadece a. ㅇ altta ise ng okunur: 방, bang.|Son ünsüzde ağız kapanır, ses patlamaz. 밥 bap diye okunur ama dudaklar kapanıp ses orada biter."],
["Heceyi çöz","Ben ekrandaki heceyi göstereceğim, siz önce kendi başınıza okuyun. Sonra Çöz'e basacağım ve hecenin parçalarını göreceğiz: ünsüz neydi, ünlü neydi, altta bir şey var mıydı.|Hız önemli değil, doğruluk önemli. Seviye 1'de ünsüz ve ünlü, seviye 2'de son ünsüz, seviye 3'te iki heceli kelimeler var. Sınıf takılırsa bir seviye geri dönün."],
["Okuma merdiveni","Kartlara dokununca harf harf açılıyor. Önce hepsini birlikte yüksek sesle okuyun, sonra tek tek öğrencilere sorun.|Kelimelerde bazı sesler değişir, örneğin 학교 hakkyo gibi okunur. Şimdilik bunlara girmeyin: okuyoruz, kuralı sonra göreceğiz deyin."]],
6:[["Ekler nedir?","Türkçede kelimenin sonuna -i, -e, -de, -in getiririz: kitabı, okula, evde, annemin. Korece de aynı mantıkla çalışır; ekler isme yapışır.|En önemli sıra kuralı: özne, nesne, fiil. Fiil en sonda, tıpkı Türkçede olduğu gibi. Ben elmayı yerim = 저는 사과를 먹어요, kelime kelime aynı sıra."],
["받침 kuralı","Ekin biçimini ismin son harfine bakarak seçiyoruz: altta ünsüz var mı? Varsa ilk biçim, yoksa ikinci. 책 altında ㄱ var, 책을. 사과 altında bir şey yok, 사과를.|Türkçedeki uyuma benzetebilirsiniz: kitap-ı, kapı-yı. Orada da ek, kelimenin sesine göre biçim değiştirir. Burada tek kontrol: altta bir şey var mı?"],
["은 / 는","Konu ekidir, ‘…ise, …gelince’ gibi. 저는 학생이에요: ben öğrenciyim. Tanışırken hep 저는 ile başlarız.|받침 varsa 은, yoksa 는. 엄마는 (alt yok), 선생님은 (altta ㅁ var).|Karşılaştırırken de kullanılır: Ben kahve içerim, o çay içer. Vurgu yapar."],
["이 / 가","Özne ekidir; kim ya da ne yapıyor sorusunun cevabını işaretler. 비가 와요: yağmur yağıyor. Yeni bilgi verirken ve soruda kullanılır: 누가 왔어요? Kim geldi? 친구가 왔어요.|받침 varsa 이, yoksa 가. 은/는 ile farkı: 은/는 ‘bu konu hakkında konuşuyorum’, 이/가 ‘şunu haber veriyorum’. Başlangıçta bu inceliğe girmeyin, sık duydukça oturur."],
["을 / 를","Nesne ekidir, Türkçedeki -i hâli: kahveyi, kitabı. 커피를 마셔요: kahveyi içiyorum.|받침 varsa 을, yoksa 를. Konuşmada çoğu zaman düşer (커피 마셔요), ama derste ekli kullanalım."],
["에 / 에서","에 yer ve zaman içindir: 학교에 가요 (okula gidiyorum), 집에 있어요 (evdeyim), 세 시에 (saat üçte). 에서 eylemin yapıldığı yerdir: 식당에서 먹어요 (restoranda yiyorum).|İpucu: fiil gitmek, olmak, bulunmak ise 에. Bir iş yapılıyorsa (yemek, çalışmak, okumak) 에서."],
["도, 의, 하고, (으)로, 부터/까지","도 = de/da: 저도 학생이에요 (ben de). 은/는 ya da 이/가 yerine geçer, yanına eklenmez.|의 = -in: 엄마의 책, annemin kitabı. Konuşmada çoğu zaman düşer; benim için 제 deriz.|하고 = ile, ve: 엄마하고 가요, annemle gidiyorum. En kolayı bu; 와/과 daha yazılıdır (ünlüden sonra 와, ünsüzden sonra 과).|(으)로 = araç ve yön: 버스로 가요, otobüsle gidiyorum. Alt yok ya da ㄹ ise 로, başka ünsüz varsa 으로.|부터/까지 = -den, -e kadar: 아홉 시부터 열 시까지."],
["이에요 / 예요","Türkçedeki -dir, -im karşılığıdır. 학생이에요: öğrenciyim. 받침 varsa 이에요, yoksa 예요: 의사예요, doktorum.|Olumsuzu 아니에요 (değil): 학생이 아니에요. Bu ders için sadece olumluyu görüyoruz, olumsuzu duyarsanız tanısınlar yeter."],
["Eki seç","Rastgele bir isim geliyor, eksik eki seçiyorsunuz; doğru ya da yanlış, nedenini hemen yazıyor. Öğrenci tahmin etmesin: önce hecenin altında bir şey var mı diye baktırın."]],
7:[["Nasıl çalışmalı?","Kelimede en önemli kural: önce hatırlamaya çalışın, sonra bakın. Karta bakıp ‘biliyorum’ demek tanımaktır; hatırlamak ise beynin çalışmasıdır ve kalıcı olan odur.|Kartlar 1, 3, 7 ve 14 gün arayla geri gelir, çünkü unutmak üzereyken yapılan tekrar kalıcılaştırır. Evde günde on dakika yeter.|Kendi çağrışımınızı bulun: 사과, sağ-va, sağ elimde elma var. Sizin bulduğunuz benimkinden iyidir."],
["Aile","Kardeş sözcükleri konuşanın cinsiyetine göre değişir; Türkçedeki abi ve abla gibi. Kadın biri ağabeyine 오빠, ablasına 언니 der. Erkek biri ağabeyine 형, ablasına 누나 der. Küçük kardeş ikisi için de 동생.|엄마 ve 아빠 anne, baba ile benzer: eomma, appa. 할머니 büyükanne, 할아버지 büyükbaba."],
["Yiyecek","차 çay gibi okunur ve çay demektir; aynı yazılan 차 araba da demek, bağlamdan anlaşılır. 밥 sadece pilav değil, genel olarak yemek ve öğün demektir. 김치 fermente sebzedir."],
["Yerler ve zaman","Yere gidiş 에 ile söylenir: 학교에 가요, 시장에 가요. Yerde yapılan iş 에서 ile: 식당에서 먹어요.|오늘 bugün, 어제 dün, 내일 yarın cümlenin başına gelir ve ek almaz: 내일 학교에 가요. Gün içi sözcüklerde 에 gelir: 아침에, sabahleyin."],
["Günlük hayat","Bunlar sınıf dışında en çok işe yarayanlar: evet, hayır, merhaba, teşekkür, özür, ne kadar, nerede. Kalıp olarak ezberletin, parçalamayın. 화장실이 어디예요? Tuvalet nerede, hayat kurtarır."],
["Fiiller ve cümleler","Fiiller sözlükte -다 ile biter: 가다, gitmek. Cümlede -요 biçimi kullanırız: 가요. Bu tek biçim hem gidiyorum hem gider anlamına gelir; zamanı bağlamdan anlarız. Özne bağlamdan anlaşılıyorsa söylenmez, Türkçedeki gibi.|Kelimelerle cümleler hep aynı kalıp: konu + yer+에 + fiil. Önce Türkçeyi okuyun, sonra parçaları tek tek söyletin: 저는, 학교에, 가요."]],
8:[["Türkçe bilenler için yol haritası","Türkçe bilen biri için güzel haber: cümle sırası aynı, özne, nesne, fiil. Ekler sona gelir. Sayıdan sonra çoğul eki yok, tıpkı üç kitap dememiz gibi.|Tek fark sayaç: Türkçede de iki tane, üç kişi deriz; tane ve kişi birer sayaçtır. Korecede bunlar çok daha fazla ve sayarken zorunlu."],
["İki sayı sistemi","Çin-Kore (일, 이, 삼) ve öz Kore (하나, 둘, 셋). Kısa kural: yaş, saat, adet, kişi, hayvan, fincan, şişe, kitap, kâğıt öz Kore ile; dakika, para, kat, ay, gün, telefon Çin-Kore ile.|Sayaçtan önce 하나 한, 둘 두, 셋 세, 넷 네, 스물 스무 olur: 한 명, 두 개, 세 시, 스무 살."],
["Sayaçlar","Kalıp: isim + sayı + sayaç. 커피 두 잔, iki fincan kahve. 사과 세 개, üç elma. 가족이 네 명, ailem dört kişi. 고양이 세 마리. 책 한 권. 표 두 장. 오 층, beşinci kat.|Saatte saat kısmı öz Kore, dakika Çin-Kore: 세 시 십 분. Buçuk için 반: 세 시 반.|Aylar Çin-Kore: 일월, 이월… Haziran 유월 ve Ekim 시월 istisnadır."],
["Sayılı cümleler","저는 스무 살이에요: yirmi yaşındayım. 몇 살이에요? Kaç yaşındasın. 몇 시예요? Saat kaç. 이거 얼마예요? Bu ne kadar; cevap 오천 원이에요, para Çin-Kore sayıyla. 오늘은 십일월 일일이에요, bugün 1 Kasım, ay ve gün Çin-Kore.|Her cümlede önce Türkçeyi okuyun, sonra sayıyı ve sayacı öğrencilere buldurun."],
["Cümleyi sırala ve kartlar","Önce Türkçeyi okuyun, sonra Korece parçaları sıraya dizin. Fiil sonda. Yanlışta ipucu veriyor.|Kartlarda önce Türkçeyi okuyup Korecesini aklınızdan getirmeye çalışın, sonra Cevabı göster. Bildim ya da Bilemedim ile kartın ne zaman geri geleceği belirlenir."]],
9:[["Sırala","Ekrandaki Türkçe cümleyi Korece parçalarla kurun. Parçayı sürükleyebilir ya da dokunabilirsiniz; dokununca cümleye girer, tekrar dokununca geri döner. Altta parçaların anlamları çıkar.|Kontrol ile sıra denetlenir, Yenile yeni cümle getirir. Sınıfa sorun: cümlenin ilk parçası ne olmalı? Fiil nerede?"],
["Serbest","Burada tüm parçalar var. Öğrencilere kendi cümlelerini kurdurun: Bugün hastaneye gidiyorum, Annem evde, İki kahve lütfen. Ek parçalarını da kullandırın.|Cümle yanlışsa altta çıkan anlam çizgisi hatayı gösterir; sorunu sınıfa buldurun."],
["Kapanış","Son beş dakikada her öğrenci üç şey yapsın: bir hece okusun, bir ek seçsin, bir sayılı cümle kursun. Ödev: Ders 7 ve 8 kartlarını her gün on dakika."]]};
var T={5:"Ders 5 · Okuma",6:"Ders 6 · Ekler",7:"Ders 7 · Kelimeler",8:"Ders 8 · Sayılar",9:"Ders 9 · Atölye"};
var P=document.getElementById("tp");
function open(){var id=CUR&&CUR.id,a=N[id]||[];document.getElementById("tpt").textContent="Öğretmen metni · "+(T[id]||"");
 document.getElementById("tpb").innerHTML=a.length?a.map(function(x){return "<details><summary>"+x[0]+"</summary>"+x[1].split("|").map(function(p){return "<p>"+p+"</p>";}).join("")+"</details>";}).join(""):"<p>Bu ders için metin yok.</p>";P.classList.add("on");}
document.getElementById("tn").addEventListener("click",function(){P.classList.contains("on")?P.classList.remove("on"):open();});

<script>
(function(){
"use strict";
var $=UI.$;
var R={
5:{g:"Hece kutusunu çözmek: başta ünsüz, sonra ünlü, altta (varsa) son ünsüz.",
x:["Tahtadaki 3 heceyi tek başına oku","Bir hecenin parçalarını söyle: ünsüz, ünlü, son ünsüz","Bir kelimeyi (나무) yüksek sesle oku"],
c:[["3 adımı","Her hece küçük bir <mark>kutudur</mark>. İçine sırayla girer: <mark>1) başlangıç ünsüzü, 2) ünlü, 3) en altta varsa son ünsüz</mark>. Yuvarlak harf başta olursa sessizdir, yok sayılır.",
[["가","g + a"],["나","n + a"],["아","sessiz + a"],["간","g + a + n"],["오","sessiz + o"]],
["Tahtaya büyük bir kare çizin. Önce kare boş, sonra ünsüz, sonra ünlü, sonra altı dolsun.","Ünlü yönü: ince uzun (dikey) ünlüler ünsüzün <mark>sağına</mark>, yatay ünlüler ünsüzün <mark>altına</mark> yazılır. Öğrenciler en çok burada şaşırır.","Sık hata: başta sessiz olan yuvarlak harfi ‘o’ ya da ‘ng’ diye okumak. Başta okunmaz; altta ‘ng’ sesi verir.","▶ Görev: Tahtaya bir hece yazın. Öğrenciler sırayla parçalarını parmakla gösterip söylesin."]],
["Heceyi çöz","<mark>Önce kendin oku</mark>, sonra Çöz tuşuna bas. Her heceye üç soru sor: Başta ne var? Ünlü ne? Altta bir şey var mı?",
[["다","d + a"],["소","s + o"],["밤","b + a + m"],["길","g + i + l"]],
["Ekrandaki heceyi önce sessizce okutun, sonra Çöz’e basın. Cevap öğrencide doğmadan açmayın.","Hız değil doğruluk önemli. Üç seviyeyi sırayla geçin; seviye atlamak için üst üste 3 doğru isteyin.","▶ Görev: İkili çalışma. Biri hece seçer, diğeri okur, sonra rol değiştirirler."]],
["Okuma merdiveni","Üç seviye var, kolaydan zora. <mark>Önce hep birlikte, sonra tek tek</mark> yüksek sesle oku. Acele etme.",
[["나무","ağaç"],["바다","deniz"],["아이","çocuk"],["우유","süt"]],
["Kartlara dokununca harfler tek tek açılır. Her kartta önce sınıf birlikte okusun, sonra tek öğrenciye sorun.","Bazı kelimelerde ses değişir (örneğin 학교). Şimdilik girmeyin; ‘duyduğunuz gibi okuyun’ deyin.","▶ Görev: Bir kelime seçin, öğrenciler defterine yazıp altına Türkçe okunuşunu yazsın."]]]},
6:{g:"Eklerin kelimeye yapıştığını, fiilin en sonda durduğunu ve ek seçmeyi öğrenmek.",
x:["Bir kelimenin altı dolu mu boş mu söyle","3 kelimeye doğru ek ekle","Bir cümlede fiili göster"],
c:[["nedir","Türkçede kitap-<mark>ı</mark>, okul-<mark>a</mark> deriz. Korecede de <mark>küçük ekler kelimenin sonuna yapışır</mark>. Sıra Türkçe gibi: <mark>özne, nesne, fiil</mark>. Fiil en sonda.",
[["엄마가 와요","Annem geliyor"],["커피를 마셔요","Kahveyi içiyorum"],["집에 있어요","Evdeyim"],["저는 학생이에요","Ben öğrenciyim"]],
